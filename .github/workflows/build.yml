name: Build APK & Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ==========================================
      # FETCH OFFICIAL LEVILAUNCHER TAGS
      # ==========================================

      - name: Fetch Latest Official LeviLauncher Tag
        id: levi-version
        run: |
          set -euo pipefail

          UPSTREAM="https://github.com/LiteLDev/LeviLaunchroid.git"

          git fetch "$UPSTREAM" \
            '+refs/tags/*:refs/tags/upstream/*'

          LATEST_TAG="$(
            git tag -l 'upstream/v*' |
            sed 's#^upstream/##' |
            sort -V |
            tail -n 1
          )"

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No official LeviLauncher version tags found."
            exit 1
          fi

          echo "Latest official LeviLauncher version: $LATEST_TAG"

          # Apply the official version tag to our current patched commit.
          # This allows Gradle's Git-based version detection to recognize it.
          git tag -f "$LATEST_TAG" "$GITHUB_SHA"

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"

      # ==========================================
      # FIREBASE CONFIGURATION
      # ==========================================

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p app

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" |
              base64 --decode > app/google-services.json
            exit 0
          fi

          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # ==========================================
      # ANDROID BUILD ENVIRONMENT
      # ==========================================

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission
        run: chmod +x ./gradlew


      # ==========================================
      # OPTIONAL DISCORD INTEGRATION
      # ==========================================

      - name: Disable unavailable Discord SDK
        run: |
          set -euo pipefail

          # The official Discord Social SDK AAR is distributed privately by upstream.
          # This CI build does not have that private dependency, so disable Rich Presence.
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          gradle = gradle_file.read_text()
          dependency = "    implementation files('libs/discord_partner_sdk.aar')\n"
          if dependency not in gradle:
              raise SystemExit("Expected Discord SDK dependency was not found in app/build.gradle")
          gradle_file.write_text(gradle.replace(dependency, "", 1))

          presence_file = Path("app/src/main/java/org/levimc/launcher/core/discord/DiscordPresence.java")
          presence_file.write_text("""package org.levimc.launcher.core.discord;

          import android.app.Application;

          /**
           * CI fallback used when the upstream private Discord Social SDK is unavailable.
           * Discord Rich Presence is intentionally disabled in this build.
           */
          public final class DiscordPresence {
              private DiscordPresence() {}

              public static void initialize(Application application) {}

              public static boolean isConfigured() {
                  return false;
              }

              public static void refresh() {}

              public static void shutdown() {}
          }
          """)
          PY

      # ==========================================
      # API CONFIGURATION
      # ==========================================

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CF_API_KEY:-}" ]; then
            echo "::error::CURSEFORGE_API_KEY secret is missing."
            exit 1
          fi

          touch local.properties
          printf 'curseforge.api_key=%s\n' "$CF_API_KEY" >> local.properties

      # ==========================================
      # RELEASE SIGNING
      # ==========================================

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/levi-release.jks"

          test -s "$RUNNER_TEMP/levi-release.jks"

      # ==========================================
      # BUILD APKs
      # ==========================================

      - name: Build Debug and Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          ./gradlew assembleDebug assembleRelease \
            -Pdiscord.application_id=0 \
            -x uploadCrashlyticsSymbolFileDebug \
            -x uploadCrashlyticsSymbolFileRelease \
            --stacktrace

      # ==========================================
      # SIGN RELEASE APK
      # ==========================================

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_PASSWORD:-}" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "::error::ANDROID_KEY_ALIAS is missing."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "::error::ANDROID_KEY_PASSWORD is missing."
            exit 1
          }

          unsigned_apk="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"

          if [ -z "$unsigned_apk" ]; then
            echo "::error::Unsigned release APK not found."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$apksigner" sign \
            --ks "$RUNNER_TEMP/levi-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out LeviLauncher-${{ steps.levi-version.outputs.version }}-release.apk \
            "$unsigned_apk"

          "$apksigner" verify --verbose \
            LeviLauncher-${{ steps.levi-version.outputs.version }}-release.apk

      # ==========================================
      # UPLOAD BUILD ARTIFACTS
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-release-signed-apk
          path: LeviLauncher-*-release.apk

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.levi-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LeviLauncher ${{ steps.levi-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            LeviLauncher-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
