name: Build APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p app

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
            exit 0
          fi

          # No real Firebase project configured - write a placeholder just
          # so the google-services Gradle plugin has a file to parse. The
          # Crashlytics symbol-upload tasks (which would otherwise fail
          # against a fake project) are excluded in the build step below,
          # so this is enough to produce a working APK without any secret.
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_KEY:-}" ]; then
            echo "::error::CURSEFORGE_API_KEY secret is missing."
            exit 1
          fi
          touch local.properties
          printf 'curseforge.api_key=%s\n' "$CF_API_KEY" >> local.properties

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/levi-release.jks"
          test -s "$RUNNER_TEMP/levi-release.jks"

      - name: Build Debug and Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: >
          ./gradlew assembleDebug assembleRelease
          -x uploadCrashlyticsSymbolFileDebug
          -x uploadCrashlyticsSymbolFileRelease
          --stacktrace

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing."; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "::error::ANDROID_KEY_ALIAS secret is missing."; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "::error::ANDROID_KEY_PASSWORD secret is missing."; exit 1; }

          unsigned_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          if [ -z "$unsigned_apk" ]; then
            echo "::error::Gradle did not produce an unsigned release APK."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/levi-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/LeviLauncher-release.apk \
            "$unsigned_apk"
          "$apksigner" verify --verbose app/build/outputs/apk/release/LeviLauncher-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-release-signed-apk
          path: app/build/outputs/apk/release/LeviLauncher-release.apk
